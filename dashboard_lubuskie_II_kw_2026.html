<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard społeczno-gospodarczy – województwo lubuskie, II kw. 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>

body{margin:0;background:#F7F9FC}
a{color:#0B3D91}a:hover{color:#072a66}
.ml{display:none;font-size:11.5px;font-weight:500;color:#536077;margin-bottom:2px}
@media (max-width: 720px){
.thead{display:none !important}
.trow{grid-template-columns:1fr 1fr !important;gap:10px 14px !important}
.trow > :first-child{grid-column:1 / -1}
.tmin{min-width:0 !important}
.ml{display:block !important}
}

</style>
</head>
<body>
<div id="app"></div>
<template id="t-Main.dc.html">

<div style="min-height: 100vh; background: #F7F9FC; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B2433; font-variant-numeric: tabular-nums">

<header style="background: #0B3D91; color: #FFFFFF">
<div style="max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 24px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #CFDBF3">DASHBOARD SPOŁECZNO-GOSPODARCZY</span>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: clamp(30px, 8vw, 44px); line-height: 1.1">Województwo lubuskie</h1>
<span style="font-size: 15px; color: #E3EBF9">Stan na II kwartał 2026 r. · Biuletyn statystyczny województwa lubuskiego (GUS)</span>
</div>
<nav style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Main.dc.html" style="padding: 10px 16px; border-radius: 8px; background: #FFFFFF; color: #0B3D91; text-decoration: none; font-size: 14px; font-weight: 600">Panel zarządczy</a>
<a href="Moduly.dc.html" style="padding: 10px 16px; border-radius: 8px; border: 1px solid #7F9CD6; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">Moduły szczegółowe</a>
<a href="Napedy.dc.html" style="padding: 10px 16px; border-radius: 8px; border: 1px solid #7F9CD6; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">Napędy, alerty, powiaty</a>
</nav>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 56px; display: flex; flex-direction: column; gap: 32px">

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px">

<div style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 24px); display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 24px">Indeks rozwoju województwa</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<span style="font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: clamp(68px, 20vw, 96px); line-height: 1">{{index.value}}</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 14px; border-radius: 999px; background: {{index.bg}}; color: {{index.tx}}; font-size: 14px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{index.fill}}"></span>{{index.arrow}} {{index.label}}</span>
<span style="font-size: 14px; color: #536077; max-width: 300px; line-height: 1.45">Skala 0–100, wartość 50 = brak zmian względem roku poprzedniego. Syntetyczny wskaźnik z 12 zmiennych.</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 14px; display: flex; gap: 2px">
<div style="flex: 40 1 0; background: #D93025; border-radius: 7px 0 0 7px"></div>
<div style="flex: 20 1 0; background: #F4B400"></div>
<div style="flex: 40 1 0; background: #2E8B57; border-radius: 0 7px 7px 0"></div>
<div style="position: absolute; top: -5px; left: {{index.pos}}%; width: 4px; height: 24px; margin-left: -2px; background: #1B2433; border-radius: 2px"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #536077"><span>0 · regres</span><span>40</span><span>60</span><span>100 · rozwój</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #536077">Metoda: dla każdej zmiennej zmiana r/r dzielona przez próg istotności (np. ±1% ludności, ±3% liczby firm), obcięta do [−1; +1] i uśredniona; kierunek uwzględnia sens zjawiska (wzrost bezrobocia obniża indeks). Progi są założeniem roboczym.</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 24px); display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 24px">Mapa sygnałów</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px">
<sc-for list="{{signalCols}}" as="col" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 4px 12px; border-radius: 999px; background: {{col.bg}}; color: {{col.tx}}; font-size: 13px; font-weight: 600"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{col.fill}}"></span>{{col.arrow}} {{col.title}}</span>
<sc-for list="{{col.items}}" as="a" hint-placeholder-count="2">
<div style="border-top: 1px solid #DDE3EE; padding-top: 10px; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600"><span>{{a.name}}</span><span style="color: {{col.tx}}">{{a.score}}</span></div>
<span style="font-size: 12.5px; line-height: 1.4; color: #536077">{{a.drv}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>

</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 28px">Co dzieje się w regionie?</h2>
<span style="font-size: 13px; color: #536077">Zmiany: kw./kw. i r/r (wskaźniki stanu: czerwiec vs marzec i czerwiec 2025; przepływy: II kw. vs I kw. i II kw. 2025)</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
<article style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #536077; font-weight: 500">{{t.area}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{t.bg}}; color: {{t.tx}}; font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.fill}}"></span>{{t.arrow}} {{t.label}}</span>
</div>
<div style="font-size: 14px; font-weight: 600">{{t.name}}</div>
<div style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap"><span style="font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1">{{t.value}}</span><span style="font-size: 13px; color: #536077">{{t.unit}}</span></div>
<div style="display: flex; gap: 20px; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #536077">{{t.d1l}}</span><span style="font-weight: 600; color: {{t.d1c}}">{{t.d1}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #536077">{{t.d2l}}</span><span style="font-weight: 600; color: {{t.d2c}}">{{t.d2}}</span></div>
</div>
<sc-if value="{{t.hasSpark}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: 34px">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%; display: block" aria-hidden="true"><polyline points="{{t.spark}}" fill="none" stroke="#0B3D91" stroke-width="2" vector-effect="non-scaling-stroke"></polyline></svg>
<div style="position: absolute; right: 0; top: {{t.endTop}}%; width: 8px; height: 8px; margin: -4px -4px 0 0; border-radius: 50%; background: #0B3D91; border: 2px solid #FFFFFF; box-sizing: content-box"></div>
</div>
<span style="font-size: 11.5px; color: #536077; margin-top: -6px">ostatnie 18 miesięcy</span>
</sc-if>
<span style="font-size: 12.5px; line-height: 1.45; color: #536077">{{t.note}}</span>
</article>
</sc-for>
</div>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 24px); display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 24px">Komentarz automatyczny</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6">W II kwartale 2026 r. liczba podmiotów REGON wzrosła o 0,4% kw./kw. (+1,5% r/r), a przeciętne wynagrodzenie w czerwcu było o 5,9% wyższe niż przed rokiem. Jednocześnie stopa bezrobocia rejestrowanego wzrosła r/r o 1,2 pp do 6,0%, a liczba ludności (koniec 2025 r.) spadła o 0,6%. Sugeruje to utrzymującą się aktywność gospodarczą pomimo niekorzystnych trendów demograficznych i słabnącego rynku pracy.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 24px); display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 24px">Poza zakresem biuletynu</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #536077">Cztery kafle z koncepcji dashboardu nie mają danych w tym biuletynie, więc nie są pokazane, zamiast uzupełniać je szacunkami:</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5">
<li><strong>Saldo migracji</strong> – do podpięcia z Banku Danych Lokalnych GUS</li>
<li><strong>Liczba studentów</strong> – BDL GUS</li>
<li><strong>Liczba lekarzy</strong> – BDL GUS</li>
<li><strong>Jakość powietrza</strong> – dane GIOŚ</li>
</ul>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 28px">Stan → Trend → Przyczyna → Skutek → Wniosek</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px">
<sc-for list="{{chain}}" as="c" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #DDE3EE; border-top: 4px solid {{c.color}}; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #0B3D91">{{c.step}}</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.2">{{c.head}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3B4658">{{c.text}}</span>
</div>
</sc-for>
</div>
</section>

</main>
</div>
</template>
<template id="t-Moduly.dc.html">

<div style="min-height: 100vh; background: #F7F9FC; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B2433; font-variant-numeric: tabular-nums">

<header style="background: #0B3D91; color: #FFFFFF">
<div style="max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 24px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #CFDBF3">DASHBOARD SPOŁECZNO-GOSPODARCZY</span>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: clamp(30px, 8vw, 44px); line-height: 1.1">Moduły szczegółowe</h1>
<span style="font-size: 15px; color: #E3EBF9">Województwo lubuskie · II kwartał 2026 r.</span>
</div>
<nav style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Main.dc.html" style="padding: 10px 16px; border-radius: 8px; border: 1px solid #7F9CD6; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">Panel zarządczy</a>
<a href="Moduly.dc.html" style="padding: 10px 16px; border-radius: 8px; background: #FFFFFF; color: #0B3D91; text-decoration: none; font-size: 14px; font-weight: 600">Moduły szczegółowe</a>
<a href="Napedy.dc.html" style="padding: 10px 16px; border-radius: 8px; border: 1px solid #7F9CD6; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">Napędy, alerty, powiaty</a>
</nav>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 56px; display: flex; flex-direction: column; gap: 28px">

<nav aria-label="Skok do modułu" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
<a href="#dem" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Demografia</a>
<a href="#lab" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Rynek pracy</a>
<a href="#eco" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Gospodarka</a>
<a href="#ind" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Przemysł</a>
<a href="#bld" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Budownictwo i mieszkalnictwo</a>
<a href="#gap" style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EE; text-decoration: none; font-weight: 500">Edukacja, zdrowie, środowisko</a>
</nav>

<!-- ============ DEMOGRAFIA ============ -->
<section id="dem" style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px">Demografia</h2>
<span style="font-size: 13px; color: #536077">Dane za 2025 r. (ludność wg stanu 31 XII)</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 32px">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 14px">
<sc-for list="{{dem.stats}}" as="s" hint-placeholder-count="6">
<div style="background: #F7F9FC; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; color: #536077">{{s.label}}</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: clamp(20px, 5.5vw, 26px); line-height: 1.15">{{s.value}}</span>
<span style="font-size: 12.5px; line-height: 1.4; font-weight: 500; color: {{s.color}}">{{s.sub}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 600">Powiązania</h3>
<sc-for list="{{dem.links}}" as="l" hint-placeholder-count="3">
<div style="border-top: 1px solid #DDE3EE; padding-top: 10px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 600; color: #0B3D91">{{l.head}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3B4658">{{l.text}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 26px">
<sc-for list="{{dem.lines}}" as="c" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 600">{{c.title}}</span><span style="font-size: 12.5px; color: #536077">{{c.unit}}</span></div>
<div style="display: flex; gap: 8px">
<div style="position: relative; width: 44px; height: 200px; flex: none">
<sc-for list="{{c.grid}}" as="g" hint-placeholder-count="4"><span style="position: absolute; right: 0; top: {{g.top}}%; transform: translateY(-50%); font-size: 11.5px; color: #536077">{{g.label}}</span></sc-for>
</div>
<div style="position: relative; flex: 1; height: 200px; min-width: 0">
<sc-for list="{{c.grid}}" as="g" hint-placeholder-count="4"><div style="position: absolute; left: 0; right: 0; top: {{g.top}}%; border-top: 1px solid #E6EAF2"></div></sc-for>
<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible" aria-hidden="true">
<polyline points="{{c.points}}" fill="none" stroke="#0B3D91" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
<polyline points="{{c.extPoints}}" fill="none" stroke="#0B3D91" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></polyline>
</svg>
<sc-for list="{{c.dots}}" as="d" hint-placeholder-count="4"><div title="{{d.tip}}" style="position: absolute; left: {{d.left}}%; top: {{d.top}}%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: {{d.fill}}; border: 2px solid #FFFFFF; box-sizing: content-box"></div></sc-for>
<sc-for list="{{c.dotLabels}}" as="d" hint-placeholder-count="4"><span style="position: absolute; left: {{d.left}}%; top: {{d.top}}%; transform: translate(-50%, -22px); font-size: 12px; font-weight: 600; white-space: nowrap">{{d.label}}</span></sc-for>
<div style="position: absolute; inset: 0; display: flex">
<sc-for list="{{c.hits}}" as="h" hint-placeholder-count="4"><div title="{{h.tip}}" style="flex: 1 1 0; height: 100%"></div></sc-for>
</div>
<sc-if value="{{c.hasEnd}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 100%; top: {{c.endTop}}%; width: 10px; height: 10px; margin: -5px -5px 0 0; border-radius: 50%; background: #0B3D91; border: 2px solid #FFFFFF; box-sizing: content-box"></div>
<span style="position: absolute; right: 0; top: {{c.endTop}}%; transform: translateY(-26px); font-size: 12.5px; font-weight: 600">{{c.endLabel}}</span>
</sc-if>
</div>
</div>
<div style="position: relative; height: 16px; margin-left: 52px">
<sc-for list="{{c.xt}}" as="x" hint-placeholder-count="4"><span style="position: absolute; left: {{x.left}}%; transform: translateX(-50%); font-size: 11.5px; color: #536077; white-space: nowrap">{{x.label}}</span></sc-for>
</div>
<span style="font-size: 12.5px; line-height: 1.45; color: #536077">{{c.note}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 600">Struktura ludności według wieku</span><span style="font-size: 12.5px; color: #536077">% ludności, 31 XII 2025</span></div>
<div style="display: flex; gap: 2px; height: 34px">
<sc-for list="{{dem.age}}" as="a" hint-placeholder-count="3"><div title="{{a.tip}}" style="flex: {{a.share}} 1 0; background: {{a.fill}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 13px; font-weight: 600; min-width: 0">{{a.pct}}</div></sc-for>
</div>
<div style="display: flex; gap: 2px; font-size: 12.5px; color: #3B4658">
<sc-for list="{{dem.age}}" as="a" hint-placeholder-count="3"><div style="flex: {{a.share}} 1 0; min-width: 0; line-height: 1.35">{{a.name}}</div></sc-for>
</div>
</div>
</div>
</div>
</section>

<!-- ============ RYNEK PRACY ============ -->
<section id="lab" style="background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 10px; padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px">Rynek pracy</h2>

    grid: o.ticks.map((t) => ({ top: Y(t).toFixed(1), label: o.tickFmt ? o.tickFmt(t) : String(t) })),

    out.dots = o.ys.map((v, i) => ({ left: (xs[i] * 100).toFixed(2), top: Y(v).toFixed(1), tip: o.tips[i], fill: NAVY }));

    out.hits = o.ys.map((v, i) => ({ tip: o.tips[i] }));

}

      const reds = [s65, nat, un, rg].filter((x) => x === 'r').length;
      return {

      'Najwyższe bezrobocie ma powiat ' + unHigh.name + ' (' + pl(unHigh.unv, 1) + '%), najniższe powiat świebodziński (3,4%).';

    return { drivers, relations, alerts, alertCounts, vsPoland, powiaty: rows, focus };

}
